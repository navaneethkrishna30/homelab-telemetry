# Every alert goes to the phone: the ntfy topic in NTFY_URL (.env). The same notification is also posted to the
# hub (homelab-fe), which keeps it as the Alerts page's notification history; the phone doesn't depend on it. One notification per alert name; a critical
# alert repeats every 4 hours while it fires, a warning once a day.
route:
  receiver: ntfy
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 24h
  routes:
    - matchers: [severity="critical"]
      repeat_interval: 4h

receivers:
  - name: ntfy
    webhook_configs:
      - url_file: /tmp/ntfy-url
        send_resolved: true
      - url: http://homelab-fe-web-1:8000/api/alerts/notified
        send_resolved: true
        http_config:
          http_headers:
            X-Family-Share: {values: ["1"]}   # the hub refuses writes without it
