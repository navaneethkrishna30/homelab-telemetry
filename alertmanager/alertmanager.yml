# Every notification is posted to the hub (homelab-fe), which keeps it as the Alerts page's history; Grafana shows
# them too. Nothing is pushed to the phone. A critical alert repeats every 4 hours while it fires, a warning once a day.
route:
  receiver: hub
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 24h
  routes:
    - matchers: [severity="critical"]
      repeat_interval: 4h

receivers:
  - name: hub
    webhook_configs:
      - url: http://homelab-fe-web-1:8000/api/alerts/notified
        send_resolved: true
        http_config:
          http_headers:
            X-Family-Share: {values: ["1"]}   # the hub refuses writes without it
