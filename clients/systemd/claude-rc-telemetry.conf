# Install: mkdir -p ~/.config/systemd/user/claude-rc.service.d
#          cp this file there as telemetry.conf; systemctl --user daemon-reload; systemctl --user restart claude-rc
# Adds the RC-specific label on top of the settings.json env (same key is overridden here).
[Service]
Environment=OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318
Environment=OTEL_RESOURCE_ATTRIBUTES=host.name=CHANGE_ME,deployment.environment=homelab,claude.mode=remote-control
