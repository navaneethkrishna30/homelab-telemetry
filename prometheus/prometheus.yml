global:
  scrape_interval: 15s

# Host and Claude Code metrics arrive via Alloy remote_write.
# Only the stack's own components are scraped directly.
scrape_configs:
  - job_name: telemetry-stack
    static_configs:
      - targets: ["localhost:9090"]
        labels: {service: prometheus}
      - targets: ["loki:3100"]
        labels: {service: loki}
      - targets: ["tempo:3200"]
        labels: {service: tempo}
      - targets: ["alloy:12345"]
        labels: {service: alloy}
      - targets: ["grafana:3000"]
        labels: {service: grafana}
  # Immich, via immich-exporter (API polling; see immich-exporter/exporter.py).
  - job_name: immich
    static_configs:
      - targets: ["immich-exporter:9101"]
  # Immich's native metrics (IMMICH_TELEMETRY_INCLUDE on the apps-owned server; published on the
  # bridge gateway). Down until that change is applied.
  - job_name: immich-native
    static_configs:
      - targets: ["172.30.0.1:8081"]
        labels: {component: api}
      - targets: ["172.30.0.1:8082"]
        labels: {component: microservices}
