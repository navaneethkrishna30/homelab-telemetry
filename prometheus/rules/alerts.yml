# Alerts for the always-on machines (the server and the router). Laptops and the gaming PC sleep, so
# they are left out on purpose. Thresholds mirror homelab-fe's status rules (api/app/rules.py in the
# homelab repo) so the web UI and the alerts agree; change both together.
#
# Alertmanager (alertmanager/alertmanager.yml) sends them to the phone through ntfy. `severity` is
# warning (look today) or critical (look now, repeated every 4 hours).
#
# Every rule carries two more annotations for the hub's Alerts page, which lists the rules: `watches` (what it
# looks at) and `threshold` (when it trips, in words; the page adds the `for:` time itself).

groups:
  - name: storage
    rules:
      - alert: DiskFilling
        expr: host:root_fs_usage:ratio{host_name="veronica"} >= 0.80
        for: 15m
        labels: {severity: warning}
        annotations:
          watches: "How full veronica's disk is"
          threshold: "80% full"
          summary: "veronica's disk is {{ $value | humanizePercentage }} full"
      - alert: DiskAlmostFull
        expr: host:root_fs_usage:ratio{host_name="veronica"} >= 0.90
        for: 15m
        labels: {severity: critical}
        annotations:
          watches: "How full veronica's disk is"
          threshold: "90% full"
          summary: "veronica's disk is {{ $value | humanizePercentage }} full"
      # Any btrfs read/write/corruption error on the only copy of the live data.
      - alert: BtrfsDeviceErrors
        expr: node_btrfs_device_errors_total{host_name="veronica"} > 0
        labels: {severity: critical}
        annotations:
          watches: "btrfs read, write and corruption error counters on veronica's disk"
          threshold: "any error"
          summary: "btrfs reports {{ $labels.type }} errors on {{ $labels.device }}"

  - name: backup
    rules:
      - alert: BackupFailed
        expr: immich_backup_last_result == 0
        for: 10m
        labels: {severity: critical}
        annotations:
          watches: "The result of the last nightly backup run: every job and every copy"
          threshold: "the run failed"
          summary: "The last backup run failed: a job or a copy (see /var/log/homelab-backup.log)"
      # The run starts at 04:00 and takes minutes; 26 h leaves room for a slow night.
      - alert: BackupMissed
        expr: time() - immich_backup_last_success_timestamp_seconds > 26 * 3600
        labels: {severity: warning}
        annotations:
          watches: "Time since the last successful backup run"
          threshold: "26 hours"
          summary: "No successful backup for {{ $value | humanizeDuration }}"
      - alert: BackupMissedTwice
        expr: time() - immich_backup_last_success_timestamp_seconds > 50 * 3600
        labels: {severity: critical}
        annotations:
          watches: "Time since the last successful backup run"
          threshold: "50 hours"
          summary: "No successful backup for {{ $value | humanizeDuration }}"
      - alert: BackupTimerDisabled
        expr: immich_backup_timer_enabled == 0
        for: 1h
        labels: {severity: warning}
        annotations:
          watches: "Whether the nightly homelab-backup timer is enabled"
          threshold: "disabled"
          summary: "The nightly homelab-backup timer is disabled"
      # The status script runs every 5 min; without it every backup alert above goes blind.
      - alert: BackupStatusStale
        expr: (time() - immich_backup_status_timestamp_seconds > 20 * 60) or absent(immich_backup_status_timestamp_seconds)
        for: 10m
        labels: {severity: warning}
        annotations:
          watches: "The backup-status script, which feeds every backup alert"
          threshold: "no report for 20 minutes"
          summary: "backup-status has stopped reporting"

  - name: services
    rules:
      - alert: ImmichDown
        expr: immich_up < 1 or absent(immich_up)
        for: 5m
        labels: {severity: critical}
        annotations:
          watches: "Whether Immich answers"
          threshold: "not answering"
          summary: "Immich is not answering"
      - alert: ScrapeTargetDown
        expr: up{job=~"telemetry-stack|immich|immich-native"} == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          watches: "Prometheus's scrapes of the telemetry stack and Immich"
          threshold: "a target is down"
          summary: "{{ $labels.job }} target {{ $labels.instance }} is down"
      - alert: SystemdUnitFailed
        expr: node_systemd_unit_state{state="failed", host_name="veronica"} == 1
        for: 10m
        labels: {severity: warning}
        annotations:
          watches: "Every systemd unit on veronica"
          threshold: "a unit has failed"
          summary: "{{ $labels.name }} has failed on veronica"
      # homelab_service_up comes from boot-check in the homelab repo (every 2 min): each container with a restart
      # policy and each key unit. It restarts what a reboot left down in the first 10 minutes, so this fires only
      # for something it could not bring back, or that went down later. Prometheus being down it reports itself.
      - alert: ServiceDown
        expr: homelab_service_up{host_name="veronica"} == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          watches: "Every container and key service on veronica, checked every 2 minutes"
          threshold: "one is down"
          summary: "{{ $labels.name }} is down on veronica"
      - alert: ServiceCheckStale
        expr: time() - homelab_service_check_timestamp_seconds{host_name="veronica"} > 900 or absent(homelab_service_check_timestamp_seconds{host_name="veronica"})
        for: 5m
        labels: {severity: warning}
        annotations:
          watches: "Whether veronica's service check (boot-check timer) still runs"
          threshold: "no check for 15 minutes"
          summary: "veronica's service check has not run for 15 minutes"

  - name: hosts
    rules:
      - alert: RouterDown
        expr: host:online{host_name="heimdall"} == 0 or absent(host:online{host_name="heimdall"})
        for: 5m
        labels: {severity: critical}
        annotations:
          watches: "Whether Heimdall is still sending metrics"
          threshold: "no metrics"
          summary: "Heimdall has stopped reporting"
      - alert: InternetDown
        expr: max(heimdall_ping_up{target!="gateway"}) == 0
        for: 3m
        labels: {severity: critical}
        annotations:
          watches: "Heimdall's pings to the internet"
          threshold: "none answered"
          summary: "Heimdall can't reach the internet"
      - alert: MemoryPressure
        expr: host:memory_usage:ratio{host_name="veronica"} >= 0.95
        for: 15m
        labels: {severity: warning}
        annotations:
          watches: "veronica's memory use"
          threshold: "95% used"
          summary: "veronica's memory is {{ $value | humanizePercentage }} used"
      - alert: CpuHot
        expr: host:cpu_temp_celsius{host_name="veronica"} >= 85
        for: 10m
        labels: {severity: warning}
        annotations:
          watches: "veronica's CPU temperature"
          threshold: "85 °C"
          summary: "veronica's CPU is at {{ $value }} °C"

  # Jarvis's hosted speech vendors (metrics from the Jarvis API in the homelab repo, jarvis/api/app/observe.py).
  # Per account, so a second account of the same vendor alerts on its own.
  - name: jarvis
    rules:
      - alert: SpeechFreeTierNearlyUsed
        expr: jarvis_speech_month_credits / jarvis_speech_month_credits_limit >= 0.80
        for: 5m
        labels: {severity: warning}
        annotations:
          watches: "Each speech account's credits this month against its free tier"
          threshold: "80% of the free tier used"
          summary: "Speech account {{ $labels.account }} has used {{ $value | humanizePercentage }} of its free credits this month"
      - alert: SpeechAccountExhausted
        expr: jarvis_speech_account_exhausted == 1
        for: 1m
        labels: {severity: warning}
        annotations:
          watches: "Whether a speech account was refused for credits, quota or its key"
          threshold: "an account is exhausted"
          summary: "Speech account {{ $labels.account }} is out of credits, quota or key; Jarvis moved on to the next one until the month ends or the key changes"
      # Alerts reach the phone through the Jarvis API, so its own death goes to ntfy instead (alertmanager.yml).
      - alert: JarvisDown
        expr: up{job="jarvis-api"} == 0 or absent(up{job="jarvis-api"})
        for: 5m
        labels: {severity: critical}
        annotations:
          watches: "Prometheus's scrape of the Jarvis API, which delivers every other alert"
          threshold: "not answering"
          summary: "The Jarvis API is down: alerts can't reach the Jarvis app"
