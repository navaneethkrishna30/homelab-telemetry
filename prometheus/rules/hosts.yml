# Normalised per-host signals for the Hosts overview dashboard (and Home Assistant later).
#
# Every machine reports with different exporters and chip names (k10temp vs coretemp, RAPL vs
# LibreHardwareMonitor, ...). These rules turn them into one set of `host:*` series keyed only by
# host_name, so the overview never needs to know what hardware a host has. To add a host with a
# different exporter (Scorpio: windows_exporter + OhmGraphite), add rules here that record the same
# names from its metrics; nothing on the dashboard changes.
#
# Per-host dashboards read the raw metrics instead, for the full detail.

groups:
  - name: host-linux
    interval: 15s
    rules:
      # 1 while the host is reporting. Works for both routes (direct scrape on Veronica, OTLP from fedora),
      # neither of which carries a reliable `up` series.
      - record: host:online
        expr: max by (host_name) (time() - timestamp(node_time_seconds) < bool 30)
      - record: host:uptime_seconds
        expr: time() - max by (host_name) (node_boot_time_seconds)

      # ---- CPU
      - record: host:cpu_count
        expr: count by (host_name) (node_cpu_seconds_total{mode="idle"})
      - record: host:cpu_usage:ratio
        expr: 1 - avg by (host_name) (rate(node_cpu_seconds_total{mode="idle"}[30s]))
      - record: host:load1
        expr: max by (host_name) (node_load1)
      - record: host:cpu_frequency_hertz:avg
        expr: avg by (host_name) (node_cpu_scaling_frequency_hertz)
      - record: host:cpu_frequency_hertz:max
        expr: max by (host_name) (node_cpu_scaling_frequency_hertz)
      - record: host:cpu_temp_celsius
        expr: |
          max by (host_name) (
            node_hwmon_temp_celsius
            * on (host_name, chip) group_left (chip_name)
            node_hwmon_chip_names{chip_name=~"k10temp|zenpower|coretemp"}
          )
      - record: host:cpu_power_watts
        expr: sum by (host_name) (rate(node_rapl_package_joules_total[30s]))

      # ---- Memory
      - record: host:memory_total_bytes
        expr: max by (host_name) (node_memory_MemTotal_bytes)
      - record: host:memory_used_bytes
        expr: max by (host_name) (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes)
      - record: host:memory_usage:ratio
        expr: host:memory_used_bytes / host:memory_total_bytes
      - record: host:swap_usage:ratio
        expr: |
          max by (host_name) (
            1 - node_memory_SwapFree_bytes / (node_memory_SwapTotal_bytes > 0)
          )

      # ---- GPU
      # amdgpu via node_exporter's drm collector. That collector also lists Intel cards (as vendor="amd",
      # all zeros), so only cards with a GTT size count. Intel iGPUs come from intel-gpu-exporter:
      # busiest engine, since engines run in parallel (Render/3D, Video, ...).
      - record: host:gpu_busy:ratio
        expr: |
          max by (host_name) (node_drm_gpu_busy_percent and on (host_name, card) node_drm_memory_gtt_size_bytes > 0) / 100
          or max by (host_name) (intel_gpu_engine_busy_ratio)
      - record: host:gpu_memory_used_bytes
        expr: sum by (host_name) (node_drm_memory_vram_used_bytes and on (host_name, card) node_drm_memory_gtt_size_bytes > 0)
      - record: host:gpu_frequency_hertz
        expr: |
          max by (host_name) (
            node_hwmon_freq_freq_mhz * on (host_name, chip) group_left (chip_name) node_hwmon_chip_names{chip_name="amdgpu"}
          ) * 1e6
          or max by (host_name) (intel_gpu_frequency_hertz{type="actual"})
      - record: host:gpu_temp_celsius
        expr: |
          max by (host_name) (
            node_hwmon_temp_celsius
            * on (host_name, chip) group_left (chip_name)
            node_hwmon_chip_names{chip_name=~"amdgpu|nouveau|xe|i915"}
          )

      # ---- Thermals and fans
      - record: host:fan_rpm:max
        expr: max by (host_name) (node_hwmon_fan_rpm)
      - record: host:disk_temp_celsius:max
        expr: |
          max by (host_name) (
            node_hwmon_temp_celsius
            * on (host_name, chip) group_left (chip_name)
            node_hwmon_chip_names{chip_name=~"nvme|drivetemp"}
          )

      # ---- Storage and network
      - record: host:root_fs_usage:ratio
        expr: |
          max by (host_name) (
            1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}
          )
      - record: host:disk_read_bytes:rate
        expr: sum by (host_name) (rate(node_disk_read_bytes_total{device!~"dm-.*|zram.*|loop.*"}[30s]))
      - record: host:disk_written_bytes:rate
        expr: sum by (host_name) (rate(node_disk_written_bytes_total{device!~"dm-.*|zram.*|loop.*"}[30s]))
      # Physical interfaces only: tailscale traffic already crosses the NIC, bridges/veths are Docker.
      - record: host:network_receive_bytes:rate
        expr: sum by (host_name) (rate(node_network_receive_bytes_total{device!~"lo|tailscale.*|docker.*|br-.*|veth.*|virbr.*"}[30s]))
      - record: host:network_transmit_bytes:rate
        expr: sum by (host_name) (rate(node_network_transmit_bytes_total{device!~"lo|tailscale.*|docker.*|br-.*|veth.*|virbr.*"}[30s]))

      # ---- Battery (laptops only; absent elsewhere)
      - record: host:battery_capacity:ratio
        expr: max by (host_name) (node_power_supply_capacity{power_supply=~"BAT.*"}) / 100
      - record: host:battery_power_watts
        expr: |
          sum by (host_name) (
            node_power_supply_current_ampere{power_supply=~"BAT.*"}
            * on (host_name, power_supply)
            node_power_supply_voltage_volt{power_supply=~"BAT.*"}
          )
      - record: host:on_ac_power
        expr: max by (host_name) (node_power_supply_online{power_supply=~"AC.*|ADP.*"})
