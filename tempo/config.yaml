stream_over_http_enabled: true

server:
  http_listen_port: 3200

distributor:
  # Hermes (hermes_otel, content_capture full) puts the whole prompt on each api.* span; the default cap is 2 KB.
  max_attribute_bytes: 1048576
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

compactor:
  compaction:
    block_retention: 1080h   # 45d

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
